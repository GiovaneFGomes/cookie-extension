<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cookie Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="container">

    <header>
        <div class="logo">
            🍪
        </div>

        <div>
            <h1>Cookie Manager</h1>
            <p>Copie e cole cookies rapidamente</p>
        </div>
    </header>

    <div class="actions">

        <button class="copy-btn past">
            📋 Copiar Cookies
        </button>

        <button class="paste-btn save">
            📥 Colar Cookies
        </button>

    </div>

    <textarea
            class="cookie"
            placeholder="Os cookies aparecerão aqui..."
    ></textarea>

    <footer>
        Cookie Manager v1.0
    </footer>

</div>

<script src="popup.js"></script>

</body>
</html>
